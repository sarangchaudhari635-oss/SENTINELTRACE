spring.application.name=sentineltrace

# DataSource Settings (PostgreSQL)
spring.datasource.url=${DB_URL:jdbc:postgresql://localhost:5432/sentineltrace}
spring.datasource.username=${DB_USERNAME:postgres}
spring.datasource.password=${DB_PASSWORD:Sarang}
spring.datasource.driver-class-name=org.postgresql.Driver

# JPA & Hibernate Settings
spring.jpa.hibernate.ddl-auto=update
spring.jpa.open-in-view=false
spring.jpa.properties.hibernate.dialect=org.hibernate.dialect.PostgreSQLDialect
spring.jpa.show-sql=false
spring.jpa.properties.hibernate.format_sql=true

# Server configuration
server.port=${SERVER_PORT:8081}
server.error.include-message=never
server.error.include-binding-errors=never
server.error.include-stacktrace=never
server.error.include-exception=false

# Thymeleaf
spring.thymeleaf.cache=false

# Logging
logging.level.com.sentineltrace=INFO
logging.level.org.springframework.web=INFO
